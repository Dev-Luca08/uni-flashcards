async function importBackup(file) {
  try {
    const obj = JSON.parse(decodeText(await file.arrayBuffer()));
    if (!obj || obj.app !== 'luca-flashcards' || !Array.isArray(obj.decks)) throw new Error('bad');
    let added = 0, updated = 0;
    for (const f of obj.folders || []) if (f && f.id && !getFolder(f.id)) folders.push(f);
    Store.touchFolders();
    for (const d of obj.decks) {
      if (!d || !d.id || !Array.isArray(d.cards)) continue;
      Store.tombs.delete(d.id);
      const i = decks.findIndex(x => x.id === d.id);
      if (i < 0) { decks.push(d); added++; Store.touch(d); }
      else if ((d.updated || 0) > (decks[i].updated || 0)) { decks[i] = d; updated++; Store.touch(d); }
    }
    render();
    toast(added || updated ? `Back-up teruggezet: ${plural(added, 'nieuwe set', 'nieuwe sets')}${updated ? `, ${updated} bijgewerkt` : ''}` : 'Alles uit deze back-up stond er al');
  } catch (e) { toast('Dit is geen back-up van Luca Flashcards.'); }
}

/* ---------- Install as an app (only outside claude.ai) ---------- */
let installPrompt = null;
const isStandalone = () => window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
const isIOS = () => /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
function installHint() {
  if (window.claude || isStandalone()) return '';
  if (installPrompt) return `<button class="btn block install-btn" data-act="install">📲 Installeer Luca Flashcards als app</button>`;
  if (isIOS()) return `<p class="install-tip">📲 <b>Installeren op iPhone:</b> tik in Safari op het Deel-icoon en kies <b>“Zet op beginscherm”</b>.</p>`;
  return '';
}

/* =========================================================
   Views
   ========================================================= */
const brandSvg = `<svg class="brand-mark" viewBox="0 0 44 44" aria-hidden="true"><rect x="9" y="5" width="30" height="22" rx="4" transform="rotate(8 24 16)" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="2"/><rect x="5" y="14" width="30" height="22" rx="4" fill="var(--surface)" stroke="var(--ink)" stroke-width="2"/><line x1="5" y1="21" x2="35" y2="21" stroke="var(--rule-red)" stroke-width="2"/><line x1="10" y1="27" x2="30" y2="27" stroke="var(--rule-blue)" stroke-width="2"/><line x1="10" y1="31" x2="24" y2="31" stroke="var(--rule-blue)" stroke-width="2"/></svg>`;
const FOLDER_COLORS = 6;
let homeFolder = null;

const getFolder = id => folders.find(f => f.id === id);
const deckFolder = d => (d.folder && getFolder(d.folder)) ? d.folder : '';
const byRecent = (a, b) => Math.max(b.last || 0, b.created || 0) - Math.max(a.last || 0, a.created || 0);
const folderOptions = (sel) => `<option value=""${!sel ? ' selected' : ''}>Geen map</option>` +
  folders.map(f => `<option value="${f.id}"${sel === f.id ? ' selected' : ''}>${esc(f.name)}</option>`).join('') +
  `<option value="__new__">+ Nieuwe map…</option>`;

function deckCard(d) {
  const s = deckStats(d);
  const pk = s.total ? (s.kn / s.total * 100) : 0, pl = s.total ? (s.lr / s.total * 100) : 0;
  const todo = s.todo
    ? `<b>${s.todo}</b> te oefenen vandaag`
    : (s.total ? `Klaar voor vandaag${s.tomorrow ? ` · morgen ${s.tomorrow}` : ''}` : 'Nog geen kaarten');
  return `<article class="deck">
    <button class="deck-main" data-act="study" data-id="${d.id}" aria-label="Oefen ${esc(d.name)}">
      <h2>${esc(d.name)}</h2>
      <p class="meta">${d.n} kanten · ${plural(s.total, 'kaart', 'kaarten')} · ${d.names.slice(0, d.n).map(esc).join(' → ')}</p>
      <div class="meter" aria-hidden="true"><span class="m-known" style="width:${pk}%"></span><span class="m-learn" style="width:${pl}%"></span></div>
      <div class="legend"><span><i class="dot k"></i>Gekend <b>${s.kn}</b></span><span><i class="dot l"></i>Aan het leren <b>${s.lr}</b></span><span><i class="dot n"></i>Nieuw <b>${s.nw}</b></span></div>
    </button>
    <div class="deck-foot">
      <span class="todo">${todo}</span>
      <div class="acts">
        <button class="btn ghost sm" data-act="edit" data-id="${d.id}">Bewerken</button>
        ${s.todo ? `<button class="btn primary sm" data-act="study" data-id="${d.id}">Oefenen</button>`
                 : `<button class="btn sm" data-act="cram" data-id="${d.id}" ${s.total ? '' : 'disabled'}>Alles oefenen</button>`}
      </div>
    </div>
  </article>`;
}

function newFolderForm() {
  return `<form class="card-box folder-form" data-form="new-folder">
      <label class="lbl" for="f-name">Naam van de map</label>
      <input class="field" id="f-name" placeholder="bv. Spaans, Economie, Geschiedenis" autocomplete="off" maxlength="40">
      <div class="btn-row"><button class="btn primary sm" type="submit">Map maken</button><button class="btn sm" type="button" data-act="folder-cancel">Annuleren</button></div>
    </form>`;
}

function renderHome() {
  const [cls, txt] = syncInfo();
  const fid = view.folder && getFolder(view.folder) ? view.folder : null;
  if (fid) return renderFolder(fid);

  const loose = decks.filter(d => !deckFolder(d)).sort(byRecent);
  const tiles = folders.map(f => {
    const ds = decks.filter(d => d.folder === f.id);
    const todo = ds.reduce((a, d) => a + deckStats(d).todo, 0);
    const cards = ds.reduce((a, d) => a + d.cards.length, 0);
    return `<button class="folder c${f.c % FOLDER_COLORS}" data-act="open-folder" data-id="${f.id}">
        <span class="folder-tab" aria-hidden="true"></span>
        <span class="folder-name">${esc(f.name)}</span>
        <span class="folder-meta">${plural(ds.length, 'set', 'sets')} · ${plural(cards, 'kaart', 'kaarten')}</span>
        <span class="folder-todo">${todo ? `<b>${todo}</b> te oefenen` : (ds.length ? 'Klaar voor vandaag' : 'Nog leeg')}</span>
      </button>`;
  }).join('');

  const empty = `<section class="empty">
      <h2>Maak je eerste set flashcards</h2>
      <p class="muted">Zet je woorden in een tabel zoals hieronder: elke kolom wordt één kant van de kaart. Upload daarna je bestand (Excel, CSV, Word, PDF, Numbers …) of kopieer en plak de cellen.</p>
      <div class="sheet-demo"><table>
        <tr><th class="rn"></th><th>A</th><th>B</th><th>C</th></tr>
        <tr><td class="rn">1</td><td><b>Spaans</b></td><td><b>Engels</b></td><td><b>Zin</b></td></tr>
        <tr><td class="rn">2</td><td>el perro</td><td>dog</td><td>El perro duerme en el sofá.</td></tr>
        <tr><td class="rn">3</td><td>correr</td><td>to run</td><td>Me gusta correr en el parque.</td></tr>
        <tr><td class="rn">4</td><td>la playa</td><td>beach</td><td>En verano vamos a la playa.</td></tr>
      </table></div>
      <button class="btn block" data-act="sample">Probeer een voorbeeldset (Spaans, 3 kanten)</button>
    </section>`;

  let main = '';
  if (folders.length) {
    main += `<p class="section-title">Mappen</p><section class="folders">${tiles}</section>`;
    if (loose.length) main += `<p class="section-title">Sets zonder map</p><section class="decks">${loose.map(deckCard).join('')}</section>`;
  } else if (decks.length) {
    main += `<section class="decks">${loose.map(deckCard).join('')}</section>`;
  } else main = empty;

  return `<header class="home-head">
      <div class="brand">${brandSvg}<div><h1>Luca Flashcards</h1><p>Je sets en mappen</p></div></div>
      <span id="sync" class="sync ${cls}"><i></i>${esc(txt)}</span>
    </header>
    <div class="home-actions">
      <button class="btn primary new-btn" data-act="new">+ Nieuwe set</button>
      <button class="btn new-btn" data-act="folder-new">+ Nieuwe map</button>
    </div>
    ${installHint()}
    ${view.newFolder ? newFolderForm() : ''}
    ${main}
    <div class="backup-row">
      <button class="btn ghost sm" data-act="backup">Back-up maken</button>
      <label class="btn ghost sm" for="backup-file">Back-up terugzetten<input type="file" id="backup-file" accept=".json,application/json" hidden></label>
    </div>
    ${window.claude ? `<div class="zip-box">
      <div><b>Offline-app downloaden</b><p class="muted small">Een versie om te installeren die zonder internet werkt. Pak de zip uit en zet de bestanden op GitHub Pages (uitleg in README.md).</p></div>
      <button class="btn primary sm" data-act="app-zip">⬇ Download zip</button>
    </div>` : ''}
    <footer class="footer">Made by <b>Luca Cicarelli</b></footer>`;
}

function renderFolder(fid) {
  const f = getFolder(fid);
  const ds = decks.filter(d => d.folder === fid).sort(byRecent);
  const manage = view.rename
    ? `<form class="card-box" data-form="rename-folder">
        <label class="lbl" for="f-rename">Nieuwe naam</label>
        <input class="field" id="f-rename" value="${esc(f.name)}" maxlength="40">
        <div class="btn-row"><button class="btn primary sm" type="submit">Opslaan</button><button class="btn sm" type="button" data-act="folder-manage-cancel">Annuleren</button></div>
      </form>`
    : view.confirm === 'folder'
      ? `<div class="card-box danger-zone"><p>Map <b>${esc(f.name)}</b> verwijderen? ${ds.length ? `De ${plural(ds.length, 'set', 'sets')} erin blijven bewaard bij “Sets zonder map”.` : ''}</p>
          <div class="btn-row"><button class="btn sm danger solid" data-act="folder-delete-yes">Ja, map verwijderen</button><button class="btn sm" data-act="folder-manage-cancel">Annuleren</button></div></div>`
      : '';
  return `<header class="bar"><button class="icon-btn" data-act="folder-back" aria-label="Terug naar alle mappen">←</button>
      <h1 class="folder-title c${f.c % FOLDER_COLORS}"><i aria-hidden="true"></i>${esc(f.name)}</h1></header>
    <div class="home-actions">
      <button class="btn primary new-btn" data-act="new">+ Nieuwe set in deze map</button>
    </div>
    <div class="btn-row folder-tools">
      <button class="btn ghost sm" data-act="folder-rename">Hernoemen</button>
      <button class="btn ghost sm" data-act="folder-delete">Map verwijderen</button>
    </div>
    ${manage}
    <section class="decks">${ds.length ? ds.map(deckCard).join('') : `<div class="empty"><p class="muted">Nog geen sets in deze map. Maak er hierboven een, of verplaats een bestaande set via <b>Bewerken → Map</b>.</p></div>`}</section>
    <footer class="footer">Made by <b>Luca Cicarelli</b></footer>`;
}

function moveButtons(i, n, act) {
  return `<span class="mover">
      <button class="icon-btn sm-icon" data-act="${act}" data-i="${i}" data-dir="-1" aria-label="Kant ${i + 1} naar voren" ${i === 0 ? 'disabled' : ''}>↑</button>
      <button class="icon-btn sm-icon" data-act="${act}" data-i="${i}" data-dir="1" aria-label="Kant ${i + 1} naar achteren" ${i === n - 1 ? 'disabled' : ''}>↓</button>
    </span>`;
}
function sideHead(i, n, act) {
  return `<div class="side-head"><span class="num">Kant ${i + 1}${i === 0 ? ' <em>· zie je eerst</em>' : ''}</span>${moveButtons(i, n, act)}</div>`;
}

function renderWizard() {
  const w = wiz;
  const deck = w.append ? getDeck(w.append) : null;
  const title = deck ? 'Kaarten toevoegen' : 'Nieuwe set';
  const stepTxt = deck ? '' : `<span class="step">Stap ${w.step} van 3</span>`;
  const back = w.step === 1 || (deck && w.step === 2) ? (deck ? 'edit-back' : 'home') : 'wiz-back';
  let body = '';

  if (w.step === 1) {
    const ex = { 2: 'woord → uitleg', 3: 'woord → uitleg → zin', 4: 'woord → uitleg → zin → extra' };
    body = `<div class="card-box">
        <label class="lbl" for="w-name">Naam van de set</label>
        <input class="field" id="w-name" data-wiz="name" value="${esc(w.name)}" placeholder="bv. Spaans – hoofdstuk 3" autocomplete="off">
        <label class="lbl" for="w-folder">Map</label>
        <select class="field" id="w-folder">${folderOptions(w.folder)}</select>
      </div>
      <div class="card-box">
        <p class="lbl">Hoeveel kanten heeft elke kaart?</p>
        <p class="help">Elke kolom uit je lijst wordt één kant. Spaans, uitleg en zin? Kies 3. De volgorde kies je straks zelf.</p>
        <div class="sides-pick">${[2, 3, 4].map(n => `<button class="pick" data-act="wiz-n" data-n="${n}" aria-pressed="${w.n === n}">
            <span class="stack">${Array.from({ length: n }, (_, i) => `<span style="left:${i * 6}px;top:${(n - 1 - i) * 5}px"></span>`).join('')}</span>
            <b>${n} kanten</b><small>${ex[n]}</small></button>`).join('')}</div>
      </div>
      <button class="btn primary block" data-act="wiz-next">Verder</button>`;
  } else if (w.step === 2) {
    const tab = (k, t) => `<button role="tab" aria-selected="${w.source === k}" data-act="wiz-src" data-src="${k}">${t}</button>`;
    let src = '';
    if (w.source === 'file') {
      src = `<label class="drop${w.loading ? ' busy' : ''}" id="drop" for="w-file">
          <input type="file" id="w-file">
          <span class="big" aria-hidden="true">${w.loading ? '⏳' : '⬆'}</span>
          <strong>${w.loading ? 'Bestand lezen…' : 'Kies je bestand'}</strong>
          <span class="muted small">Excel · CSV · Word · PDF · Numbers · OpenOffice · tekst<br>of sleep het hierheen</span>
        </label>`;
    } else if (w.source === 'paste') {
      src = `<div class="card-box">
          <label class="lbl" for="w-paste">Plak je lijst</label>
          <p class="help">Kopieer cellen uit Excel, Numbers of Google Sheets, of een lijstje zoals <i>el perro = dog</i> of <i>correr - to run</i>, en plak hieronder.</p>
          <textarea class="field" id="w-paste" data-wiz="paste" placeholder="el perro&#9;dog&#9;El perro duerme en el sofá.">${esc(w.paste)}</textarea>
          <button class="btn primary block" data-act="wiz-paste">Verder</button>
        </div>`;
    } else {
      src = `<div class="card-box">
          <p class="lbl">Kaarten zelf intypen</p>
          <p class="help" style="margin-top:0">${deck ? 'Je krijgt lege kaarten om in te vullen.' : `Je krijgt een lege set met ${w.n} kanten waarin je kaarten kunt typen.`}</p>
          <button class="btn primary block" data-act="wiz-manual">${deck ? 'Lege kaart toevoegen' : 'Lege set maken'}</button>
        </div>`;
    }
    body = `<p class="muted">${deck ? `Toevoegen aan <b>${esc(deck.name)}</b> (${deck.n} kanten).` : `Je set krijgt <b>${w.n} kanten</b>. Elke kolom wordt één kant.`}</p>
      <div class="tabs" role="tablist">${tab('file', 'Bestand')}${tab('paste', 'Plakken')}${tab('manual', 'Zelf typen')}</div>
      ${w.error ? `<p class="error" role="alert">${esc(w.error)}</p>` : ''}
      ${src}`;
  } else {
    const rows = curRows();
    const { cards, half, dupes } = wizardCards();
    const sheetNames = Object.keys(w.sheets).filter(k => k !== '__all__');
    const allLabel = /^Tabel /.test(sheetNames[0] || '') ? 'Alle tabellen samen' : 'Alle werkbladen samen';
    const colOpts = (sel) => `<option value="-1"${sel === -1 ? ' selected' : ''}>(leeg laten)</option>` +
      Array.from({ length: w.cols }, (_, ci) => {
        const sample = (w.header ? rows[0][ci] : (rows.find(r => r[ci]) || [])[ci]) || '';
        return `<option value="${ci}"${sel === ci ? ' selected' : ''}>Kolom ${colLetter(ci)}${sample ? ' – ' + esc(sample.slice(0, 22)) : ''}</option>`;
      }).join('');
    let warn = '';
    if (w.cols < w.n) {
      warn = `<div class="warn"><span>Je lijst heeft maar <b>${w.cols} ${w.cols === 1 ? 'kolom' : 'kolommen'}</b>, maar je koos ${w.n} kanten. ${w.n - w.cols === 1 ? 'Eén kant blijft' : 'Sommige kanten blijven'} leeg.</span>
        ${!w.append && w.cols >= 2 ? `<button class="btn sm" data-act="wiz-fit">Gebruik ${w.cols} kanten</button>` : ''}</div>`;
    } else if (w.cols > w.n) {
      warn = `<div class="warn"><span>Je lijst heeft <b>${w.cols} kolommen</b> en je koos ${w.n} kanten. Kies hieronder welke kolommen je gebruikt.</span>
        ${!w.append && w.cols <= 4 ? `<button class="btn sm" data-act="wiz-fit">Gebruik alle ${w.cols} kolommen</button>` : ''}</div>`;
    }
    const nt = w.notes || {};
    const fixes = [];
    if (nt.title) fixes.push(nt.title === 1 ? 'titel bovenaan overgeslagen' : `${nt.title} titelregels overgeslagen`);
    if (nt.numbering) fixes.push('nummering weggehaald');
    if (nt.split) fixes.push('woord en uitleg uit elkaar gehaald');
    if (half) fixes.push(`${plural(half, 'halve rij', 'halve rijen')} overgeslagen`);
    if (dupes) fixes.push(`${plural(dupes, 'dubbele kaart', 'dubbele kaarten')} overgeslagen`);
    const prev = cards.slice(0, 5);
    body = `<p class="found">Gevonden in <b>${esc(w.fileName)}</b>: ${plural(w.cols, 'kolom', 'kolommen')} en ${plural(rows.length, 'rij', 'rijen')}.</p>
      ${fixes.length ? `<p class="fixed">Automatisch opgeschoond: ${fixes.join(' · ')}.</p>` : ''}
      ${sheetNames.length > 1 ? `<div class="card-box"><label class="lbl" for="w-sheet">Welk deel van het bestand?</label><select class="field" id="w-sheet">
          <option value="__all__"${w.sheet === '__all__' ? ' selected' : ''}>${allLabel}</option>
          ${sheetNames.map(s => `<option value="${esc(s)}"${s === w.sheet ? ' selected' : ''}>${esc(s)}</option>`).join('')}</select></div>` : ''}
      ${warn}
      <div class="card-box">
        <label class="check"><input type="checkbox" id="w-header" ${w.header ? 'checked' : ''}> Eerste rij is een titelrij (wordt geen kaart)</label>
      </div>
      <div class="card-box">
        <p class="lbl">Welke kolom komt op welke kant?</p>
        <p class="help">Kant 1 zie je eerst. Staat de taal die je moet kennen in de verkeerde kolom? Verschuif de kanten met ↑ ↓ of wissel ze om.</p>
        ${w.map.map((ci, i) => `<div class="map-row">${sideHead(i, w.n, 'wiz-move')}
          <input class="field" data-wiz-name="${i}" value="${esc(w.names[i])}" aria-label="Naam van kant ${i + 1}" ${w.append ? 'disabled' : ''}>
          <select class="field" data-wiz-col="${i}" aria-label="Kolom voor kant ${i + 1}">${colOpts(ci)}</select></div>`).join('')}
        <button class="btn sm swap-btn" data-act="wiz-move" data-i="0" data-dir="1">⇅ Wissel kant 1 en 2</button>
      </div>
      <p class="lbl">Zo worden je kaarten</p>
      <div class="preview"><table><thead><tr>${w.names.map((n, i) => `<th>${i + 1}. ${esc(n)}</th>`).join('')}</tr></thead>
        <tbody>${prev.map(r => `<tr>${r.map(v => `<td>${esc(v) || '<span class="muted">—</span>'}</td>`).join('')}</tr>`).join('') || `<tr><td colspan="${w.n}" class="muted">Geen kaarten gevonden. Kies andere kolommen of zet het vinkje voor de titelrij uit.</td></tr>`}</tbody></table></div>
      ${cards.length > 5 ? `<p class="muted small">…en nog ${cards.length - 5} meer.</p>` : ''}
      <div class="sticky-save"><button class="btn primary block" data-act="wiz-save" ${cards.length ? '' : 'disabled'}>${w.append ? `${plural(cards.length, 'kaart', 'kaarten')} toevoegen` : `Set opslaan · ${plural(cards.length, 'kaart', 'kaarten')}`}</button></div>`;
  }
  return `<header class="bar"><button class="icon-btn" data-act="${back}" aria-label="Terug">←</button><h1>${title}</h1>${stepTxt}</header>
    <section class="panel">${body}</section>`;
}

function renderEdit() {
  const d = getDeck(view.deckId); if (!d) { view = { name: 'home', folder: homeFolder }; return renderHome(); }
  const s = deckStats(d);
  const langSel = (i) => `<select class="field" data-deck-lang="${i}" aria-label="Voorlezen kant ${i + 1}">${LANGS.map(([v, t]) => `<option value="${v}"${(d.langs[i] || '') === v ? ' selected' : ''}>${t}</option>`).join('')}</select>`;
  const stLabel = c => c.st === 'new' ? 'nieuw' : c.st === 'learn' ? `aan het leren (${c.k}/2)` : `gekend · over ${Math.max(0, c.due - today())} d`;
  const rows = d.cards.map((c, idx) => `<div class="card-row" data-row="${c.id}">
      <span class="idx">${idx + 1}</span>
      <div class="fields">${Array.from({ length: d.n }, (_, i) => `<input class="field" data-card="${c.id}" data-side="${i}" value="${esc(c.s[i] || '')}" placeholder="${esc(d.names[i])}" aria-label="${esc(d.names[i])}, kaart ${idx + 1}">`).join('')}
        <span class="st">${stLabel(c)}</span></div>
      <button class="icon-btn" data-act="del-card" data-id="${c.id}" aria-label="Verwijder kaart ${idx + 1}">×</button>
    </div>`).join('');
  const opt = d.opt || {};
  return `<header class="bar"><button class="icon-btn" data-act="home" aria-label="Terug">←</button><h1>Set bewerken</h1>
      <button class="btn primary sm" data-act="study" data-id="${d.id}" ${s.todo ? '' : 'hidden'}>Oefenen</button></header>
    <section class="panel">
      <div class="card-box">
        <label class="lbl" for="e-name">Naam</label>
        <input class="field" id="e-name" data-deck-field="name" value="${esc(d.name)}">
        <label class="lbl" for="e-folder">Map</label>
        <select class="field" id="e-folder">${folderOptions(deckFolder(d))}</select>
      </div>
      <div class="card-box">
        <p class="lbl">Volgorde van de kanten</p>
        <p class="help">Kant 1 zie je eerst, daarna kant 2, enzovoort. Verschuif met ↑ ↓; je voortgang blijft bewaard.</p>
        <p class="order-line">${d.names.slice(0, d.n).map((n, i) => `<span>${i + 1}. ${esc(n)}</span>`).join('<i aria-hidden="true">→</i>')}</p>
        ${Array.from({ length: d.n }, (_, i) => `<div class="side-row">${sideHead(i, d.n, 'side-move')}
          <input class="field" data-deck-name="${i}" value="${esc(d.names[i])}" aria-label="Naam kant ${i + 1}">${langSel(i)}</div>`).join('')}
        <button class="btn sm swap-btn" data-act="side-move" data-i="0" data-dir="1">⇅ Wissel kant 1 en 2</button>
        <p class="help" style="margin-top:0">Het tweede vakje per kant is de taal voor de 🔊 voorleesknop.</p>
      </div>
      <div class="card-box">
        <p class="lbl">Oefenen</p>
        <div class="opts">
          <div><label class="small muted" for="o-new">Nieuwe kaarten per dag</label>
            <select class="field" id="o-new" data-opt="newLimit">${[10, 20, 30, 50, 100, 0].map(v => `<option value="${v}"${(opt.newLimit ?? 30) === v ? ' selected' : ''}>${v || 'Allemaal'}</option>`).join('')}</select></div>
          <div><label class="small muted" for="o-start">Begin met kant</label>
            <select class="field" id="o-start" data-opt="start">${d.names.slice(0, d.n).map((n, i) => `<option value="${i}"${(opt.start ?? 0) === i ? ' selected' : ''}>${i + 1}: ${esc(n)}</option>`).join('')}<option value="-1"${opt.start === -1 ? ' selected' : ''}>Willekeurig</option></select></div>
        </div>
        <label class="check"><input type="checkbox" data-opt="shuffle" ${opt.shuffle ? 'checked' : ''}> Kaarten door elkaar schudden</label>
      </div>
      <div class="btn-row">
        <button class="btn sm" data-act="add-import" data-id="${d.id}">+ Kaarten importeren</button>
        <button class="btn sm" data-act="export" data-kind="xlsx">Exporteer .xlsx</button>
        <button class="btn sm" data-act="export" data-kind="csv">Exporteer .csv</button>
      </div>
      <p class="section-title">${plural(d.cards.length, 'kaart', 'kaarten')}</p>
      <input class="field" id="e-filter" placeholder="Zoek in je kaarten…" aria-label="Zoek in kaarten">
      <div class="card-list" id="card-list">${rows}</div>
      <button class="btn block" data-act="add-card">+ Kaart toevoegen</button>
      <div class="card-box danger-zone">
        <p class="lbl">Opnieuw beginnen of verwijderen</p>
        <div class="btn-row">
          ${view.confirm === 'reset'
            ? `<button class="btn sm danger solid" data-act="reset-yes">Ja, alle voortgang wissen</button><button class="btn sm" data-act="confirm-no">Annuleren</button>`
            : `<button class="btn sm danger" data-act="ask" data-what="reset">Voortgang resetten</button>`}
          ${view.confirm === 'delete'
            ? `<button class="btn sm danger solid" data-act="delete-yes">Ja, set verwijderen</button><button class="btn sm" data-act="confirm-no">Annuleren</button>`
            : `<button class="btn sm danger" data-act="ask" data-what="delete">Set verwijderen</button>`}
        </div>
      </div>
    </section>`;
}

function textSize(t) { const n = t.length; return n <= 18 ? 's1' : n <= 45 ? 's2' : n <= 120 ? 's3' : 's4'; }

function renderStudy() {
  const d = getDeck(session.deckId); const c = currentCard();
  if (!d || !c) { view = { name: 'home', folder: homeFolder }; return renderHome(); }
  const sideIdx = (session.start + session.side) % d.n;
  const text = c.s[sideIdx] || '';
  const uniq = [...new Set(session.queue)].map(id => d.cards.find(x => x.id === id)).filter(Boolean);
  const cNew = uniq.filter(x => x.st === 'new').length, cLearn = uniq.filter(x => x.st === 'learn').length, cRev = uniq.filter(x => x.st === 'review').length;
  const pct = session.total ? Math.min(100, Math.round((session.total - uniq.length) / session.total * 100)) : 0;
  const chip = c.st === 'new' ? `<span class="chip new">Nieuw</span>`
    : c.st === 'learn' ? `<span class="chip learn">Leren <i class="pip ${c.k >= 1 ? 'on' : ''}"></i><i class="pip"></i></span>`
    : `<span class="chip review">Herhaling</span>`;
  const lang = d.langs[sideIdx];
  const canSpeak = !!(lang && text && window.speechSynthesis);
  const answers = session.revealed
    ? `<div class="answers">
        <button class="ans again" data-act="ans" data-g="again"><span class="lbl-t">Nog niet</span><small>komt snel terug</small></button>
        <button class="ans hard" data-act="ans" data-g="hard"><span class="lbl-t">Ken het, herhaal</span><small>komt later terug</small></button>
        <button class="ans good" data-act="ans" data-g="good"><span class="lbl-t">Ik ken het</span><small>${esc(goodPreview(c))}</small></button>
      </div>`
    : `<div class="answers single"><button class="btn primary flip-btn" data-act="flip">Draai om</button></div>`;
  const anim = session.anim; session.anim = false;
  return `<div class="study">
    <header class="bar">
      <button class="icon-btn" data-act="study-exit" aria-label="Stoppen">✕</button>
      <div class="title"><b>${esc(d.name)}</b>
        <span class="counts"><span class="c-new">${cNew} nieuw</span><span class="c-learn">${cLearn} leren</span><span class="c-rev">${cRev} herhalen</span></span></div>
      <button class="icon-btn" data-act="undo" aria-label="Vorige antwoord ongedaan maken" title="Ongedaan maken" ${session.history.length ? '' : 'disabled'}>↶</button>
    </header>
    <div class="progress" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><span style="width:${pct}%"></span></div>
    <div class="stage"><div class="card-wrap">
      <button class="flash${anim ? ' anim' : ''}" data-act="flip" aria-label="Kaart: ${esc(d.names[sideIdx])}. Tik om om te draaien.">
        <div class="flash-top"><span class="side-label">${esc(d.names[sideIdx])}</span>${chip}</div>
        <div class="flash-body"><p class="flash-text ${text ? textSize(text) : 'blank'}">${text ? esc(text) : '(deze kant is leeg)'}</p></div>
        <div class="flash-foot">
          <span class="side-dots" aria-hidden="true">${Array.from({ length: d.n }, (_, i) => `<span class="${i === session.side ? 'on' : ''}"></span>`).join('')}</span>
          <span class="tap-hint">${session.revealed ? 'tik voor de volgende kant' : 'tik om om te draaien'}</span>
        </div>
      </button>
      ${canSpeak ? `<button class="speak" data-act="speak" aria-label="Lees voor">🔊</button>` : ''}
    </div></div>
    ${answers}
  </div>`;
}

function renderDone() {
  const d = getDeck(view.deckId); if (!d) { view = { name: 'home', folder: homeFolder }; return renderHome(); }
  const s = deckStats(d);
  if (view.empty) {
    return `<section class="done">
      <h1>Niets meer te oefenen vandaag</h1>
      <p class="muted">Alle kaarten van <b>${esc(d.name)}</b> zijn bij. ${s.tomorrow ? `Morgen komen er ${s.tomorrow} terug.` : ''}</p>
      <div class="btns"><button class="btn primary" data-act="cram" data-id="${d.id}">Toch alles oefenen</button><button class="btn" data-act="home">Terug naar mijn sets</button></div>
    </section>`;
  }
  const st = session ? session.st : { again: 0, hard: 0, good: 0, learned: 0 };
  return `<section class="done">
    <h1>Ronde klaar!</h1>
    <p class="muted">${esc(d.name)}</p>
    <div class="stats">
      <div class="stat"><b>${session ? session.answered : 0}</b><span>antwoorden</span></div>
      <div class="stat"><b style="color:var(--good)">${st.learned}</b><span>nu gekend</span></div>
      <div class="stat"><b style="color:var(--again)">${st.again}</b><span>nog niet</span></div>
    </div>
    <p>${s.tomorrow ? `Morgen komen <b>${s.tomorrow}</b> kaarten terug om te herhalen.` : 'Kom morgen terug om te herhalen.'}</p>
    <div class="btns"><button class="btn primary" data-act="home">Terug naar mijn sets</button><button class="btn" data-act="cram" data-id="${d.id}">Alles nog eens oefenen</button></div>
  </section>`;
}

function render() {
  const v = view.name;
  app.innerHTML = v === 'new' ? renderWizard() : v === 'edit' ? renderEdit() : v === 'study' ? renderStudy() : v === 'done' ? renderDone() : renderHome();
}

/* =========================================================
   Events
   ========================================================= */
function swapAt(a, i, j) { const t = a[i]; a[i] = a[j]; a[j] = t; }
function moveDeckSide(d, i, dir) {
  const j = i + dir; if (j < 0 || j >= d.n) return;
  while (d.langs.length < d.n) d.langs.push('');
  swapAt(d.names, i, j); swapAt(d.langs, i, j);
  d.cards.forEach(c => { while (c.s.length < d.n) c.s.push(''); swapAt(c.s, i, j); });
  if (d.opt && d.opt.start === i) d.opt.start = j; else if (d.opt && d.opt.start === j) d.opt.start = i;
}
function createFolder(name) {
  const f = { id: uid(), name: name.slice(0, 40), c: folders.length % FOLDER_COLORS, created: Date.now() };
  folders.push(f); Store.touchFolders(); return f;
}
function goHome() { session = null; view = { name: 'home', folder: homeFolder }; render(); scrollTo(0, 0); }

const ACT = {
  home() { goHome(); },
  new() { startWizard(null, view.name === 'home' ? (view.folder || '') : ''); },
  sample() {
    const rows = [
      ['el perro', 'dog', 'El perro duerme en el sofá.'], ['la manzana', 'apple', 'Me como una manzana cada mañana.'],
      ['correr', 'to run', 'Me gusta correr en el parque.'], ['la biblioteca', 'library', 'Estudio en la biblioteca los lunes.'],
      ['cansado', 'tired', 'Estoy muy cansado después del partido.'], ['el mercado', 'market', 'Compramos fruta en el mercado.'],
      ['aprender', 'to learn', 'Quiero aprender español este año.'], ['la playa', 'beach', 'En verano vamos a la playa.']
    ];
    const d = makeDeck('Voorbeeld – Spaans', 3, ['Spaans', 'Engels', 'Zin'], rows);
    decks.push(d); Store.touch(d); render();
  },
  'open-folder'(el) { homeFolder = el.dataset.id; view = { name: 'home', folder: homeFolder }; render(); scrollTo(0, 0); },
  'folder-back'() { homeFolder = null; view = { name: 'home' }; render(); scrollTo(0, 0); },
  'folder-new'() { view.newFolder = true; render(); const i = document.getElementById('f-name'); if (i) i.focus(); },
  'folder-cancel'() { view.newFolder = false; render(); },
  'folder-rename'() { view.rename = true; view.confirm = null; render(); const i = document.getElementById('f-rename'); if (i) { i.focus(); i.select(); } },
  'folder-delete'() { view.confirm = 'folder'; view.rename = false; render(); },
  'folder-manage-cancel'() { view.confirm = null; view.rename = false; render(); },
  'folder-delete-yes'() {
    const f = getFolder(view.folder); if (!f) return;
    decks.forEach(d => { if (d.folder === f.id) { d.folder = ''; Store.touch(d); } });
    folders = folders.filter(x => x.id !== f.id); Store.touchFolders();
    homeFolder = null; view = { name: 'home' }; render(); toast(`Map "${f.name}" verwijderd`);
  },
  study(el) { startStudy(el.dataset.id, false); },
  cram(el) { startStudy(el.dataset.id, true); },
  edit(el) { view = { name: 'edit', deckId: el.dataset.id }; render(); scrollTo(0, 0); },
  'edit-back'() { const id = wiz && wiz.append; wiz = null; if (id) { view = { name: 'edit', deckId: id }; render(); } else goHome(); },
  'wiz-back'() { wiz.error = ''; wiz.step = Math.max(wiz.append ? 2 : 1, wiz.step - 1); render(); },
  'wiz-n'(el) { wiz.n = +el.dataset.n; render(); },
  'wiz-next'() { if (!wiz.name.trim()) { const i = document.getElementById('w-name'); i.focus(); i.placeholder = 'Geef je set eerst een naam'; return; } wiz.step = 2; render(); },
  'wiz-src'(el) { wiz.source = el.dataset.src; wiz.error = ''; render(); },
  'wiz-paste'() {
    if (!wiz.paste.trim()) { wiz.error = 'Plak eerst je lijst in het vak.'; render(); return; }
    setSheets({ x: parseText(wiz.paste) }, 'je geplakte lijst');
  },
  'wiz-manual'() {
    if (wiz.append) {
      const d = getDeck(wiz.append); d.cards.push(newCard(Array(d.n).fill(''))); Store.touch(d);
      view = { name: 'edit', deckId: d.id }; wiz = null; render(); focusLastCard(); return;
    }
    const names = DEFAULT_NAMES.slice(0, wiz.n);
    const d = makeDeck(wiz.name.trim(), wiz.n, names, [Array(wiz.n).fill('')]);
    d.folder = wiz.folder || '';
    decks.push(d); Store.touch(d); wiz = null;
    view = { name: 'edit', deckId: d.id }; render(); focusLastCard();
  },
  'wiz-fit'() {
    wiz.n = Math.max(2, Math.min(4, wiz.cols));
    wiz.map = Array.from({ length: wiz.n }, (_, i) => (i < wiz.cols ? i : -1));
    wiz.namesEdited = []; refreshNames(); render();
  },
  'wiz-move'(el) {
    const i = +el.dataset.i, j = i + (+el.dataset.dir); if (j < 0 || j >= wiz.n) return;
    swapAt(wiz.map, i, j);
    if (!wiz.append) { swapAt(wiz.names, i, j); swapAt(wiz.namesEdited, i, j); }
    render();
  },
  'side-move'(el) {
    const d = getDeck(view.deckId); moveDeckSide(d, +el.dataset.i, +el.dataset.dir); Store.touch(d);
    const y = scrollY; render(); scrollTo(0, y);
  },
  'wiz-save'() {
    const { cards } = wizardCards(); if (!cards.length) return;
    if (wiz.append) {
      const d = getDeck(wiz.append);
      cards.forEach(s => d.cards.push(newCard(s))); Store.touch(d);
      toast(`${plural(cards.length, 'kaart', 'kaarten')} toegevoegd`);
      view = { name: 'edit', deckId: d.id };
    } else {
      const names = wiz.names.map((n, i) => (n || '').trim() || DEFAULT_NAMES[i]);
      const d = makeDeck(wiz.name.trim(), wiz.n, names, cards);
      d.folder = wiz.folder && getFolder(wiz.folder) ? wiz.folder : '';
      decks.push(d); Store.touch(d);
      toast(`Set "${d.name}" opgeslagen met ${plural(cards.length, 'kaart', 'kaarten')}`);
      homeFolder = d.folder || null;
      view = { name: 'home', folder: homeFolder };
    }
    wiz = null; render(); scrollTo(0, 0);
  },
  flip() { flip(); },
  ans(el) { answer(el.dataset.g); },
  undo() { undo(); },
  speak() {
    const d = getDeck(session.deckId), c = currentCard(); if (!c) return;
    const i = (session.start + session.side) % d.n; speak(c.s[i], d.langs[i]);
  },
  'study-exit'() { Store.flush(); goHome(); },
  'add-card'() { const d = getDeck(view.deckId); d.cards.push(newCard(Array(d.n).fill(''))); Store.touch(d); render(); focusLastCard(); },
  'del-card'(el) {
    const d = getDeck(view.deckId); d.cards = d.cards.filter(c => c.id !== el.dataset.id); Store.touch(d);
    const row = app.querySelector(`[data-row="${el.dataset.id}"]`); if (row) row.remove();
    app.querySelectorAll('.card-row .idx').forEach((x, i) => { x.textContent = i + 1; });
    const t = app.querySelector('.section-title'); if (t) t.textContent = plural(d.cards.length, 'kaart', 'kaarten');
  },
  'add-import'(el) { startWizard(el.dataset.id); },
  export(el) { exportDeck(getDeck(view.deckId), el.dataset.kind); },
  ask(el) { view.confirm = el.dataset.what; render(); },
  'confirm-no'() { view.confirm = null; render(); },
  'reset-yes'() {
    const d = getDeck(view.deckId);
    d.cards.forEach(c => Object.assign(c, { st: 'new', k: 0, iv: 0, due: 0, reps: 0, lapses: 0 }));
    Store.touch(d); view.confirm = null; render(); toast('Voortgang gewist');
  },
  backup() { exportBackup(); },
  async 'app-zip'(el) {
    el.disabled = true;
    try {
      // The offline app's files are published next to this page; pack them into one zip
      await loadScript(LIB.jszip, 'JSZip');
      const zip = new JSZip();
      for (const f of ['index.html', 'sw.js', 'manifest.webmanifest', 'icon-192.png', 'icon-512.png', 'icon-maskable-512.png', 'apple-touch-icon.png', 'README.md']) {
        const res = await fetch('app/' + f);
        if (!res.ok) throw new Error('missing ' + f);
        zip.file(f, await res.arrayBuffer());
      }
      const data = await zip.generateAsync({ type: 'uint8array', compression: 'DEFLATE' });
      await saveFile('luca-flashcards.zip', data, 'application/zip');
    } catch (e) { toast('Downloaden lukte niet. Controleer je internet en probeer opnieuw.'); }
    el.disabled = false;
  },
  async install() {
    if (!installPrompt) return;
    installPrompt.prompt();
    try { await installPrompt.userChoice; } catch (e) { /* closed */ }
    installPrompt = null; render();
  },
  'delete-yes'() { const d = getDeck(view.deckId); Store.removeDeck(d.id); goHome(); toast(`"${d.name}" verwijderd`); }
};

function focusLastCard() {
  const inputs = app.querySelectorAll('.card-row:last-child input');
  if (inputs[0]) { inputs[0].scrollIntoView({ block: 'center' }); inputs[0].focus(); }
}

app.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || !app.contains(el) || el.disabled) return;
  const fn = ACT[el.dataset.act]; if (fn) { e.preventDefault(); fn(el, e); }
});

app.addEventListener('submit', e => {
  const form = e.target.closest('form'); if (!form) return;
  e.preventDefault();
  if (form.dataset.form === 'new-folder') {
    const name = (document.getElementById('f-name').value || '').trim();
    if (!name) { document.getElementById('f-name').focus(); return; }
    const f = createFolder(name);
    homeFolder = f.id; view = { name: 'home', folder: f.id }; render(); toast(`Map "${f.name}" gemaakt`);
  } else if (form.dataset.form === 'rename-folder') {
    const f = getFolder(view.folder); const name = (document.getElementById('f-rename').value || '').trim();
    if (f && name) { f.name = name.slice(0, 40); Store.touchFolders(); }
    view.rename = false; render();
  }
});

const editTimers = {};
app.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.wiz) { wiz[t.dataset.wiz] = t.value; return; }
  if (t.dataset.wizName !== undefined) { const i = +t.dataset.wizName; wiz.names[i] = t.value; wiz.namesEdited[i] = true; const th = app.querySelectorAll('.preview th')[i]; if (th) th.textContent = (i + 1) + '. ' + t.value; return; }
  if (t.id === 'e-filter') {
    const q = norm(t.value);
    app.querySelectorAll('.card-row').forEach(r => { r.hidden = q && !norm([...r.querySelectorAll('input')].map(i => i.value).join(' ')).includes(q); });
    return;
  }
  const d = view.name === 'edit' ? getDeck(view.deckId) : null; if (!d) return;
  if (t.dataset.card) { const c = d.cards.find(x => x.id === t.dataset.card); if (c) { c.s[+t.dataset.side] = t.value; } }
  else if (t.dataset.deckField) d[t.dataset.deckField] = t.value;
  else if (t.dataset.deckName !== undefined) d.names[+t.dataset.deckName] = t.value;
  else return;
  clearTimeout(editTimers[d.id]); editTimers[d.id] = setTimeout(() => Store.touch(d), 400);
});

// Folder pickers: "+ Nieuwe map…" asks for a name inline
function pickFolder(select, apply) {
  if (select.value !== '__new__') { apply(select.value); return; }
  const box = document.createElement('div'); box.className = 'inline-new';
  box.innerHTML = `<input class="field" id="inline-folder" placeholder="Naam van de nieuwe map" maxlength="40"><button class="btn primary sm" type="button" id="inline-folder-ok">Maak</button>`;
  select.hidden = true; select.after(box);
  const inp = box.querySelector('input'); inp.focus();
  const done = () => { const name = inp.value.trim(); if (name) { const f = createFolder(name); apply(f.id); } render(); };
  box.querySelector('button').addEventListener('click', done);
  inp.addEventListener('keydown', ev => { if (ev.key === 'Enter') { ev.preventDefault(); done(); } else if (ev.key === 'Escape') render(); });
}

app.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'w-file' && t.files && t.files[0]) { loadFile(t.files[0]); return; }
  if (t.id === 'backup-file' && t.files && t.files[0]) { importBackup(t.files[0]); return; }
  if (t.id === 'w-sheet') { wiz.sheet = t.value; applySheet(); return; }
  if (t.id === 'w-header') { wiz.header = t.checked; refreshNames(); render(); return; }
  if (t.id === 'w-folder') { pickFolder(t, v => { wiz.folder = v; }); return; }
  if (t.dataset.wizCol !== undefined) { wiz.map[+t.dataset.wizCol] = +t.value; refreshNames(); render(); return; }
  const d = view.name === 'edit' ? getDeck(view.deckId) : null; if (!d) return;
  if (t.id === 'e-folder') { pickFolder(t, v => { d.folder = v; Store.touch(d); homeFolder = v || null; toast(v ? `Verplaatst naar "${getFolder(v).name}"` : 'Uit de map gehaald'); }); return; }
  if (t.dataset.deckLang !== undefined) d.langs[+t.dataset.deckLang] = t.value;
  else if (t.dataset.opt) { d.opt = d.opt || {}; d.opt[t.dataset.opt] = t.type === 'checkbox' ? t.checked : +t.value; }
  else return;
  Store.touch(d);
});

async function loadFile(file) {
  wiz.loading = true; wiz.error = ''; render();
  try { const sheets = await readFile(file); wiz.loading = false; setSheets(sheets, file.name); }
  catch (err) {
    wiz.loading = false;
    wiz.error = err && err.userMsg ? err.userMsg
      : err && err.message === 'nolib' ? 'De lezer voor dit soort bestand kon niet laden (geen internet?). Probeer opnieuw of gebruik Plakken.'
      : 'Dit bestand kon niet gelezen worden. Sla het op als .xlsx, .csv of .docx en probeer opnieuw, of kopieer de lijst en gebruik Plakken.';
    render();
  }
}

app.addEventListener('dragover', e => { const z = e.target.closest && e.target.closest('#drop'); if (z) { e.preventDefault(); z.classList.add('over'); } });
app.addEventListener('dragleave', e => { const z = e.target.closest && e.target.closest('#drop'); if (z) z.classList.remove('over'); });
app.addEventListener('drop', e => { const z = e.target.closest && e.target.closest('#drop'); if (z) { e.preventDefault(); z.classList.remove('over'); const f = e.dataTransfer.files[0]; if (f) loadFile(f); } });

document.addEventListener('keydown', e => {
  if (view.name !== 'study' || !session) return;
  if (e.target.closest && e.target.closest('input,textarea,select')) return;
  if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); flip(); }
  else if (session.revealed && e.key === '1') answer('again');
  else if (session.revealed && e.key === '2') answer('hard');
  else if (session.revealed && e.key === '3') answer('good');
  else if (e.key === 'Escape') ACT['study-exit']();
  else if ((e.key === 'z' || e.key === 'Z') && !e.metaKey && !e.ctrlKey) undo();
});

document.addEventListener('visibilitychange', async () => {
  if (document.visibilityState === 'hidden') { Store.flush(); return; }
  if (view.name === 'home' && !view.newFolder && !view.rename && await Store.refresh()) render();
});

/* ---------- boot ---------- */
Store.tombs = Store.loadTombs();
Store.loadFolders();
decks = Store.loadLocal().filter(d => d && d.id && Array.isArray(d.cards) && !Store.tombs.has(d.id));
render();
Store.initCloud().then(changed => { if (view.name === 'home' && !view.newFolder && !view.rename) render(); else updateSyncChip(); });

// Stand-alone version (own website): work offline and keep data safe
if (!window.claude) {
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
    navigator.serviceWorker.register('sw.js').catch(() => { /* no offline mode */ });
  }
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) { /* ignore */ }
  window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installPrompt = e; if (view.name === 'home') render(); });
  window.addEventListener('appinstalled', () => { installPrompt = null; toast('Luca Flashcards is geïnstalleerd'); if (view.name === 'home') render(); });
}
</script>
